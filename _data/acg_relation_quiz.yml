source_copy:
  zh:
    privacy: 点击开始后，浏览器通常会先向 AniList 做一次跨域权限检查，再发送一次官方 GraphQL POST 查询，从按流行度排列的前 360 部动画中随机选择一页，取得六部作品及每部最多十个角色关系；不会自动翻页或重试。AniList 可看到这些请求、你的 IP 地址和本站 Origin；请求不携带凭据。响应只留在当前页面内存，不保存题目或作答，也不请求封面。AniList 网站界面主要使用英文，API 没有独立中文题名或中文角色名字段；中文页会保留作品原文与罗马字，并在角色存在原文名时显示“原文名（拉丁字母名）”。AniList 的 MAIN 通常对应主角或核心主角团，可能不止一人；三种题型都直接采用该站关系标注，不按戏份另行判断。
    loading: 正在从 AniList 取得一小批角色关系……
    prompts:
      anime_to_character: 《{title}》的主角之一是谁？
      character_to_anime: “{character}”是哪部动画的主角之一？
      character_to_character: 以下哪位与“{character}”是同一部动画的主角？
    feedback:
      anime_to_character:
        correct: 答对了！“{answer}”是《{title}》的主要角色。
        incorrect: 没猜中；“{answer}”是《{title}》的主要角色。
      character_to_anime:
        correct: 答对了！“{character}”是《{answer}》的主要角色。
        incorrect: 没猜中；“{character}”是《{answer}》的主要角色。
      character_to_character:
        correct: 答对了！“{character}”和“{answer}”都是《{title}》的主要角色。
        incorrect: 没猜中；“{character}”和“{answer}”都是《{title}》的主要角色。
    source_link_label: 在 AniList 查看《{title}》
    attribution: 作品名、角色名和 MAIN／SUPPORTING 关系来自 AniList；本站排除了其成人标记、Ecchi／Hentai 类型、若干敏感标签及命中本地敏感词的作品名或角色名，只显示文字。该过滤不能代表适合所有平台的完整内容分级。
    terms_label: 查看 AniList API 使用条款
  en:
    privacy: Starting a round normally makes one browser CORS permission check and then one official GraphQL POST query to AniList. It selects one random page among the first 360 anime in popularity order and reads six titles with at most ten character relationships each; it never follows another page or retries automatically. AniList can see these requests, your IP address, and this site's Origin; no credentials are sent. The response stays only in this page's memory. The toy does not save the round or attempt, and it does not request cover art. The English page uses AniList's English or romanized display names; AniList's MAIN label usually covers protagonists or a core main cast and may apply to more than one character. All three formats use that relationship directly and do not judge screen time independently.
    loading: Reading a small batch of character relationships from AniList…
    prompts:
      anime_to_character: Who is one of the main characters in {title}?
      character_to_anime: Which anime lists “{character}” as a main character?
      character_to_character: Who is a main character in the same anime as “{character}”?
    feedback:
      anime_to_character:
        correct: Correct! “{answer}” is a main character in {title}.
        incorrect: Not quite; “{answer}” is a main character in {title}.
      character_to_anime:
        correct: Correct! “{character}” is a main character in {answer}.
        incorrect: Not quite; “{character}” is a main character in {answer}.
      character_to_character:
        correct: Correct! “{character}” and “{answer}” are both main characters in {title}.
        incorrect: Not quite; “{character}” and “{answer}” are both main characters in {title}.
    source_link_label: "Open {title} on AniList"
    attribution: Titles, character names, and MAIN/SUPPORTING relationships come from AniList. This site excludes entries carrying AniList's adult flag, the Ecchi/Hentai genres, several sensitive tags, and titles or character names caught by a local sensitive-term filter, and shows text only. AniList notes that its filters are not a universal content rating.
    terms_label: Read the AniList API terms
