  - id: research
    type: details
    heading: 科研方向
    items:
    - id: meta_reinforcement_learning
      name: 元强化学习
      description: 我关心的是：学会的决策方法能不能迁移到新问题？研究它时，也会顺手反思人是怎么思考和做决定的。
    - id: meta_bayesian_optimization
      name: 元贝叶斯优化
      description: 让优化器借用过去的经验、少走一点弯路；既有研究空间，也很实用。
    - id: llm_agents
      name: 大模型 Agent
      description: 发展快、反馈快，效果还经常挺惊喜；正处风口，也很适合把想法迅速做成能用的东西。
  - id: interests
    type: details
    heading: 兴趣方向
    items:
    - id: board_games
      name: 桌游
      description: 广义上的桌游我基本都愿意试。主要出没在 [Board Game Arena](https://boardgamearena.com/) 和线下桌游店；BGA 用户名是 yiyuiii。
    - id: chess_and_cards
      name: 棋牌
      description: 桥牌、象棋、围棋、五子棋、国际象棋、将棋、麻将和德州扑克都学过一些；五子棋、日麻、国标麻将和德州扑克玩得更明白，其余项目以开心参与为主。
    - id: acg
      name: ACG
      description: 动画和 Galgame 爱好者，新番还在持续追。
    - id: league_of_legends
      name: 英雄联盟
      description: 电一海克斯大乱斗选手。
    - id: minecraft
      name: Minecraft
      description: 断断续续在 Java 版 Mod 服务器里住了近 10 年，最喜欢匠魂、拔刀剑和 Mekanism。
    - id: 3d_printing
      name: 3D 打印
      description: 刚入坑，手头有一台拓竹 A1 mini，会用 Fusion 360 做基础建模，最近在研究叠色打印。
    - id: badminton
      name: 羽毛球
      description: 从本科打到现在，仍是单打打不太好的快乐业余选手。
    - id: traditional_archery
      name: 传统射艺
      description: 本科时在弓协玩传统弓，目前能拉 30 磅。
    - id: swimming
      name: 游泳
      description: 认真学过几个月，蛙泳算是入门了；自由泳动作还不太规范，踩水时也仍在和下沉作斗争。
    - id: smart_home
      name: 数智化家庭
      description: 想用 LLM + Home Assistant 的可控开源方案，把家尽量变聪明。底层架构已经跑起来，正在慢慢接入更多设备。
    - id: llm_applications
      name: LLM 应用
      description: 同时订阅 ChatGPT、Ark Coding Plan / Agent Plan 和 Kimi，把不同 LLM 当成一支各有所长的队伍来带。努力做好它们的 leader，也享受这份顶级数字劳动力。
  - id: skills
