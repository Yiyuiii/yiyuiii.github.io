en:
  blocks:
  - id: greeting
    type: greeting
    text: Ciallo～(∠・ω< )⌒★
    aria_label: About yiyuiii
  - id: intro
    type: prose
    paragraphs:
    - id: donation
      style: normal
      inline_markdown: If you enjoy the writing here, I would be delighted to receive a [PayPal](https://paypal.me/yiyuiii) donation of USD 1–3. It would make my day :D
    - id: contact
      style: normal
      inline_markdown: Suggestions, questions, or just want to chat? Feel free to email me at [yiyuiii@foxmail.com](mailto:yiyuiii@foxmail.com).
  - id: aesthetics
    type: prose
    heading: Personal Tastes
    paragraphs:
    - id: mbti
      style: normal
      inline_markdown: A guy and an INTJ.
    - id: thinking_style
      style: normal
      inline_markdown: My brain tends to start breaking problems down, building models, and looking for abstractions before I ask it to. I also enjoy learning quickly—especially learning how to learn—thinking through games of strategy, and reading people. I am drawn to things that are flexible, finely crafted, practical, and new; once I have fully worked through a line of reasoning, though, I would rather not be forced to repeat it.
    - id: aesthetic_preferences
      style: normal
      inline_markdown: I like cute animals, beautiful sounds, and interesting uses of color.
  - id: education
    type: education
    heading: Education
    items:
    - id: xjtu
      fields:
      - id: time
        label: Time
        value: 2015–2019
      - id: institution
        label: University
        value: Xi’an Jiaotong University
      - id: affiliation
        label: Program
        value: Automation (Special Class for the Gifted Young)
      - id: stage
        label: Degree
        value: Bachelor’s
    - id: nju
      fields:
      - id: time
        label: Time
        value: 2019–2026
      - id: institution
        label: University
        value: Nanjing University
      - id: affiliation
        label: Department
        value: Computer Science and Technology
      - id: stage
        label: Program
        value: Direct-entry PhD
  - id: research
    type: details
    heading: Research Directions
    items:
    - id: meta_reinforcement_learning
      name: Meta-Reinforcement Learning
      description: The question that draws me in is whether a way of making decisions can transfer to new problems. Working on it also gives me an excuse to reflect on how people think and decide.
    - id: meta_bayesian_optimization
      name: Meta-Bayesian Optimization
      description: It is about helping an optimizer reuse past experience and take fewer detours—a topic with both research depth and practical value.
    - id: llm_agents
      name: LLM Agents
      description: The field moves fast, feedback comes quickly, and the results can be surprisingly powerful. It is having a moment—and it is a great place to turn ideas into useful tools.
  - id: interests
    type: details
    heading: Interests
    items:
    - id: board_games
      name: Board games
      description: I will try almost anything that counts as a board game in the broadest sense. I mostly turn up on [Board Game Arena](https://boardgamearena.com/) or at local board-game cafés; my BGA username is yiyuiii.
    - id: chess_and_cards
      name: Chess and card games
      description: I have spent some time learning bridge, Chinese chess, Go, Gomoku, chess, shogi, mahjong, and Texas hold’em. I know Gomoku, riichi mahjong, Chinese Official Mahjong, and Texas hold’em better; with the others, I am mostly there to enjoy the game.
    - id: acg
      name: ACG
      description: I enjoy anime and galgames, and I still keep up with seasonal anime.
    - id: league_of_legends
      name: League of Legends
      description: A Hextech ARAM player on the Ionia server.
    - id: minecraft
      name: Minecraft
      description: I have lived on and off in Java Edition modded servers for nearly ten years; my favorites are Tinkers’ Construct, SlashBlade, and Mekanism.
    - id: 3d_printing
      name: 3D printing
      description: I have just started, with a Bambu Lab A1 mini and some basic Fusion 360 modeling skills. Lately I have been exploring color-blending prints.
    - id: badminton
      name: Badminton
      description: I have played since college and remain a cheerful amateur who still cannot quite make singles work.
    - id: traditional_archery
      name: Traditional archery
      description: I played with traditional bows in my university archery club and can currently draw 30 pounds.
    - id: swimming
      name: Swimming
      description: I trained seriously for a few months and can now call my breaststroke passable. My freestyle form still needs work, and treading water remains a contest with sinking.
    - id: smart_home
      name: Smart home
      description: I want to make my home as smart as possible with a controllable, open-source setup built around LLMs and Home Assistant. The foundation is running, and I am gradually connecting more devices.
    - id: llm_applications
      name: LLM applications
      description: I subscribe to ChatGPT, Ark Coding Plan / Agent Plan, and Kimi, and treat different LLMs as a team with different strengths. I am learning to be a good team lead while happily letting this top-tier digital workforce do the heavy lifting.
  - id: skills
    type: details
    heading: Everyday Skills
    items:
    - id: cooking
      name: Cooking
      description: I can make rolled omelets, steamed buns, noodles, stews, and everyday stir-fries.
    - id: singing
      name: Singing
      description: I am working on vocal fundamentals; Jay Chou has more or less taken over the part of my songbook I know best.
    - id: pc_building
      name: PC building
      description: I usually build and repair my own desktops and laptops.
