  - id: research
    type: details
    heading: Research Directions
    items:
    - id: meta_reinforcement_learning
      name: Meta-Reinforcement Learning
      description: Methods for transferring decision-making across tasks can offer valuable insights for self-improvement, studying human thought, and distilling decision-making methodologies.
    - id: meta_bayesian_optimization
      name: Meta-Bayesian Optimization
      description: A practical technique with both room for research and real-world application potential.
    - id: llm_agents
      name: LLM Agents
      description: A fast-moving field with short development feedback loops and powerful results. It is a promising practical technology currently in the spotlight.
  - id: interests
    type: details
    heading: Interests
    items:
    - id: board_games
      name: Board games
      description: I am broadly familiar with all kinds of “board games.” I mostly turn up on [Board Game Arena](https://boardgamearena.com/) and at board-game cafés; my BGA username is yiyuiii.
    - id: chess_and_cards
      name: Chess and card games
      description: I have learned bridge, Chinese chess, Go, Gomoku, chess, shogi, mahjong, and Texas hold’em. I understand Gomoku, riichi mahjong, Chinese Official Mahjong, and Texas hold’em fairly well; the rest are mostly for casual play.
    - id: acg
      name: ACG
      description: An anime and galgame fan who still keeps up with seasonal releases.
    - id: league_of_legends
      name: League of Legends
      description: A Hextech ARAM player on the Ionia server.
    - id: minecraft
      name: Minecraft
      description: I have played on modded servers on and off for nearly 10 years. My favorite mods are Tinkers’ Construct, SlashBlade, and Mekanism.
    - id: 3d_printing
      name: 3D printing
      description: I am just getting started. I have a Bambu Lab A1 mini and use Fusion 360 for modeling. I am currently interested in color-blending printing.
    - id: badminton
      name: Badminton
      description: I have played badminton since university and am still an amateur who is not very good at singles.
    - id: traditional_archery
      name: Traditional archery
      description: I practiced traditional archery in my university archery club and can draw a 30-pound bow.
    - id: swimming
      name: Swimming
      description: I trained for a few months and have more or less learned the basics of breaststroke. My freestyle form is not very standard, and I cannot stay afloat while treading water.
    - id: smart_home
      name: Smart home
      description: I prefer a controllable, open-source approach based on LLMs + Home Assistant to extend and improve intelligent control of my home. The underlying architecture is in place, and I am adding more nodes.
    - id: llm_applications
      name: LLM applications
      description: I currently subscribe to ChatGPT, Ark Coding Plan / Agent Plan, and Kimi. I get to be the LLMs’ leader and enjoy a top-tier workforce.
  - id: skills
    type: details
    heading: Everyday Skills
    items:
    - id: cooking
      name: Cooking
      description: I can make rolled omelets, steamed buns, noodles, stews, and everyday stir-fries.
    - id: singing
      name: Singing
      description: I am practicing vocal fundamentals. I know Jay Chou’s songs best.
    - id: pc_building
      name: PC building
      description: I assemble and maintain my own desktop and laptop.
  - id: links
    type: links
    heading: My Links
    intro:
      id: intro
      paragraphs:
      - id: donation
        style: italic
        inline_markdown: If you enjoy my articles, I would be happy to receive a small [PayPal](https://paypal.me/yiyuiii) donation. It would make me very happy (∠・ω< )⌒★
      - id: contact
        style: normal
        inline_markdown: You are welcome to contact me by email at [yiyuiii@foxmail.com](mailto:yiyuiii@foxmail.com).
    items:
