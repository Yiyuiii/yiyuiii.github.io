  blocks:
  - id: greeting
    type: greeting
    text: Ciallo～(∠・ω< )⌒★
    aria_label: About yiyuiii
  - id: aesthetics
    type: prose
    heading: Core Traits
    paragraphs:
    - id: mbti
      style: normal
      inline_markdown: Definitely a guy, INTJ.
    - id: logic
      style: normal
      inline_markdown: I am good at logical modeling, abstract thinking, rapid learning (i.e. meta-learning), strategic reasoning, and reading people. I like things that are flexible, refined, practical, and fresh—tools, articles, art, logic, and so on. I do not want to be forced to rethink logic I already fully understand.
    - id: art
      style: normal
      inline_markdown: I like cute little animals and the lovely sounds they make.
  - id: education
    type: education
    heading: Education
    items:
