    items:
    - id: cooking
      name: 做饭
      description: 鸡蛋卷、馒头、面条、炖菜和家常炒菜都能做。
    - id: singing
      name: 唱歌
      description: 正在练声，最熟的歌单基本被周杰伦承包了。
    - id: pc_building
      name: 装机
      description: 自己的台式机和笔记本，通常自己装、自己修。
