      name: 元强化学习
      description: 元决策技术对研究人类思维、提炼决策方法论和提升自己都有很强的借鉴意义。
    - id: meta_bayesian_optimization
      name: 元贝叶斯优化
      description: 一项兼具研究空间与实际应用潜力的实用技术。
    - id: llm_agents
      name: 大模型 Agent
      description: 当前发展迅速、开发反馈快且成效直观，是很有潜力的实用技术方向。
  - id: interests
    type: details
    heading: 兴趣方向
    items:
    - id: board_games
      name: 桌游
      description: 本科加入校棋牌协会桌游部，此后持续游玩各类桌游约十年；常在 [Board Game Arena](https://boardgamearena.com/) 和线下桌游店开局，BGA 用户名为 yiyuiii。
    - id: chess_and_cards
      name: 棋牌
      description: 本科加入校棋牌协会，接触桥牌、象棋、围棋、五子棋、国际象棋、将棋、麻将和德州扑克；目前对五子棋、日麻、国标麻将和德州扑克理解相对深入，其余项目以广泛了解和休闲水平为主。
    - id: 3d_printing
      name: 3D 打印
      description: 使用 A1 mini，并能用 Fusion 360 进行基础建模；目前处于入门阶段，重点关注多材质混合和全彩打印技术。
    - id: minecraft
      name: Minecraft
      description: 断续游玩约十年，偏爱 Java 版 Mod 服务器，尤其喜欢匠魂、拔刀剑和 Mekanism，也能自行开服。
    - id: acg
      name: ACG
      description: 偏爱动画和 Galgame，持续追新番，接触至今已有十余年。
    - id: league_of_legends
      name: 英雄联盟
      description: 电一海克斯大乱斗选手。
    - id: badminton
      name: 羽毛球
      description: 从本科开始持续打羽毛球，目前是距离打好单打还差一点的业余水平。
    - id: traditional_archery
      name: 传统射艺
      description: 本科期间在弓协接触传统弓，目前能拉 30 磅。
    - id: swimming
      name: 游泳
      description: 博士阶段开始学习，目前初步掌握蛙泳。
    - id: smart_home
      name: 数智化家庭
      description: 设想利用 LLM 与 Home Assistant 连接并统一控制家中设备，目前处于方案构思和可行性探索阶段。
    - id: llm_applications
      name: LLM 应用
      description: 目前订阅 ChatGPT、Ark Coding Plan / Agent Plan 和 Kimi，持续比较不同 LLM 工具在实际工作流中的使用体验。
