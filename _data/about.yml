    text: Ciallo～(∠・ω< )⌒★
    aria_label: 关于yiyuiii
  - id: intro
    type: prose
    paragraphs:
    - id: donation
      style: normal
      inline_markdown: 如果你喜欢这里的文章，我也不介意收到 1–3 美元的 [PayPal](https://paypal.me/yiyuiii) 捐助，这会让我开心很久 :D
    - id: contact
      style: normal
      inline_markdown: 有建议、问题，或者只是想聊聊，都欢迎给我发邮件：[yiyuiii@foxmail.com](mailto:yiyuiii@foxmail.com)。
  - id: aesthetics
    type: prose
    heading: 个人基调
    paragraphs:
    - id: mbti
      style: normal
      inline_markdown: 男生，INTJ。
    - id: thinking_style
      style: normal
      inline_markdown: 脑子经常自动开始拆问题、建模和找抽象，也喜欢快速学习（尤其是学习怎么学习）、琢磨博弈和读人。偏爱灵活、精妙、实用又新鲜的东西；至于已经完全想明白的逻辑，就不太想被迫再想一遍了。
    - id: aesthetic_preferences
      style: normal
      inline_markdown: 喜欢可爱的小动物、好听的声音和有意思的色彩。
  - id: education
    type: education
    heading: 教育经历
    items:
