  - id: research
    type: details
    heading: Research Directions
    items:
    - id: meta_reinforcement_learning
      name: Meta-Reinforcement Learning
      description: Meta-decision-making can offer useful perspectives for studying human thought, distilling decision-making methods, and improving my own decisions.
    - id: meta_bayesian_optimization
      name: Meta-Bayesian Optimization
      description: A practical technique with room for further research and application.
    - id: llm_agents
      name: LLM Agents
      description: A fast-moving area with short development cycles and readily visible results, with strong practical potential.
  - id: interests
    type: details
    heading: Interests
    items:
    - id: board_games
      name: Board games
      description: I joined the board-game division of my university chess-and-card association as an undergraduate and have played a wide range of board games for about ten years. I often play on [Board Game Arena](https://boardgamearena.com/) or at local board-game cafés; my BGA username is yiyuiii.
    - id: chess_and_cards
      name: Chess and card games
      description: I joined my university chess-and-card association and explored bridge, Chinese chess, Go, Gomoku, chess, shogi, mahjong, and Texas hold’em. I currently have a relatively deeper understanding of Gomoku, riichi mahjong, Chinese Official Mahjong, and Texas hold’em; for the others, I have broad familiarity at a recreational level.
    - id: 3d_printing
      name: 3D printing
      description: I use an A1 mini and can create basic models in Fusion 360. I am still at an introductory level and am currently interested in multi-material and full-color printing.
    - id: minecraft
      name: Minecraft
      description: I have played on and off for about ten years. I prefer Java Edition modded servers, especially Tinkers’ Construct, SlashBlade, and Mekanism, and I can run a server myself.
    - id: acg
      name: ACG
      description: I prefer anime and galgames and have followed seasonal anime for more than ten years.
    - id: league_of_legends
      name: League of Legends
      description: A Hextech ARAM player on the Ionia server.
    - id: badminton
      name: Badminton
      description: I have played since my undergraduate years and am an amateur who is not quite able to play singles well yet.
    - id: traditional_archery
      name: Traditional archery
      description: I practiced traditional bows in my university archery club and can currently draw 30 pounds.
    - id: swimming
      name: Swimming
      description: I started learning during my doctoral studies and currently have a basic command of breaststroke.
    - id: smart_home
      name: Smart home
      description: I am exploring the idea of connecting and controlling household devices through LLMs and Home Assistant; it is currently at the concept and feasibility stage.
    - id: llm_applications
      name: LLM applications
      description: I currently subscribe to ChatGPT, Ark Coding Plan / Agent Plan, and Kimi, and compare how different LLM tools perform in practical workflows.
  - id: skills
    type: details
    heading: Everyday Skills
    items:
    - id: cooking
      name: Cooking
      description: I can make rolled omelets, steamed buns, noodles, stews, and everyday stir-fries.
    - id: singing
      name: Singing
      description: An amateur currently working on vocal fundamentals.
    - id: pc_building
      name: PC building
      description: I can assemble and maintain desktop PCs and maintain laptops.
