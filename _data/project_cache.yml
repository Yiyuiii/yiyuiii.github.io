- repository: Yiyuiii/taco
  source:
    locale: en
    path: README.md
    object_id: d7cd74ad8481414001e39fe89fc5bdc99ea7f93d
    description: TACO extends the LLM-based Bayesian optimization framework LLAMBO with active cross-task transfer. At each BO round, a single LLM call simultaneously proposes target hyperparameter candidates and selects an auxiliary query, accumulating cross-task evidence that feeds back into subsequent rounds.
  translations:
    zh:
      source_object_id: d7cd74ad8481414001e39fe89fc5bdc99ea7f93d
      status: current
      description: TACO 在基于大语言模型的贝叶斯优化框架 LLAMBO 上加入主动跨任务迁移。每轮贝叶斯优化只需一次大语言模型调用，即可同时提出目标超参数候选并选择辅助查询；累积的跨任务证据会反馈到后续轮次中。
