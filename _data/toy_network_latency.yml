    count_value: "{value}"
    sample_value: "{success}/{total}"
    failure_value: "{failures}/{total} ({rate}%)"
    spike_value: ">100 ms: {over100}; >200 ms: {over200}; >300 ms: {over300}"
    browser_rtt_value: "RTT {rtt}"
