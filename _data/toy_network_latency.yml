node_defaults:
  hosthatch:
    network:
      zh: HostHatch 公有云公网；官方 Looking Glass
      en: HostHatch public-cloud Internet network; official Looking Glass
    source_name: HostHatch Looking Glass
    method:
      zh: HTTPS GET；约 0.2 KB 健康响应；浏览器不透明
      en: HTTPS GET; approximately 0.2 KB health response; opaque to the browser
    features:
      zh: 固定机房；可计时和识别传输失败，不能读取 HTTP 状态、途中运营商或回程线路
      en: Fixed facility; timing and transport failures are visible, but HTTP status, intermediate carriers, and return path are not
  akamai_linode:
    network:
      zh: Akamai Connected Cloud 公有云公网；Linode 测速主机
      en: Akamai Connected Cloud public Internet network; Linode speed-test host
    source_name: Akamai Cloud Speed Test
    method:
      zh: HTTPS HEAD；零响应正文；浏览器不透明
      en: HTTPS HEAD; zero response body; opaque to the browser
    features:
      zh: 官方固定地区测速主机；可计时和识别传输失败，不能读取 HTTP 状态、途中运营商或回程线路
      en: Official fixed-region speed-test host; timing and transport failures are visible, but HTTP status, intermediate carriers, and return path are not
  vultr:
    network:
      zh: Vultr 公有云国际公网
      en: Vultr public-cloud Internet network
    source_name: Vultr Looking Glass
    method:
      zh: HTTPS HEAD；零响应正文
      en: HTTPS HEAD; zero response body
    features:
      zh: 固定都会区；允许跨域读取状态；途中运营商和回程线路未知
      en: Fixed metro; status is CORS-readable; intermediate carriers and return path are unknown

nodes:
  - id: dnspod-anycast
    default_enabled: true
    default_order: 10
    group: automatic
    title:
      zh: 全球自动接入 · 腾讯 DNSPod
      en: Global automatic entry · Tencent DNSPod
    location:
      zh: 官方公开北京、上海、广州、中国香港和北美接入集群；本页无法识别实际落点
      en: Officially listed entry clusters in Beijing, Shanghai, Guangzhou, Hong Kong, and North America; the actual landing point is not visible here
    network:
      zh: 公共递归 DNS；BGP Anycast 多运营商接入
      en: Public recursive DNS; multi-carrier BGP Anycast access
    source_name: Tencent Cloud DNSPod Public DNS
    source_url: https://www.dnspod.cn/products/publicdns
    method:
      zh: DoH GET；小型 DNS 查询
      en: DoH GET; small DNS query
    features:
      zh: BGP Anycast 自动选路；可能接入大陆、中国香港或北美；响应对浏览器不透明，不能验证 HTTP 状态或实际落点
      en: BGP Anycast-selected and may enter Mainland China, Hong Kong, or North America; the browser response is opaque, so HTTP status and the actual PoP cannot be verified

  - id: alidns-global
    default_enabled: true
    default_order: 20
