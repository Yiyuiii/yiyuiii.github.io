copy:
  zh:
    privacy: 测试请求会把你的公网 IP、浏览器标识和请求时间发送给对应服务商。一次完整测试对每个启用节点发送 1 次预热和 60 次采样请求；当前网络信息先请求一次 IPIP.NET，只有失败时才请求一次 IP.SB；启用 Cloudflare 节点时，其原有响应可作为仅含 IP 的最后补充。页面不保存测试结果或节点选择，不使用 Cookie、localStorage 或 sessionStorage，也不会后台续测。
    visitor_title: 当前网络
    visitor_source_intro: "来源依次尝试 "
    visitor_source_between: "，失败后才尝试 "
    visitor_source_suffix: 。
    visitor_source_current: 本次采用：
    visitor_sources:
      ipip: IPIP.NET
      ipsb: IP.SB
      cloudflare: Cloudflare 节点（仅部分信息）
    visitor_fields:
      ip: 公网 IP / 版本
      network: 运营商 / 网络
      region: 近似地区
      browser_connection: 浏览器估计
    unavailable: 无法获取
    metric_placeholder: "—"
    test_start: 开始测试
    stop: 停止
    test_idle: 尚未开始
    test_warming: 正在并发获取当前网络信息并预热 {nodes} 个节点……
    selection_title: 节点选择
    selection_count: "{selected}/{total} 已启用"
    selection_default: 恢复默认
    selection_all: 全选
    selection_none: 清空
    selection_empty: 请至少启用一个节点。
    node_groups:
      automatic: 自动接入
      asia: 亚洲
      oceania: 大洋洲
      europe: 欧洲
      north_america: 北美洲
      south_america: 南美洲
      africa: 非洲
    test_progress: 已收到 {current}/{total} 个样本；{complete}/{nodes} 个节点完成。
    test_done: 全部节点测试完成，共收到 {current}/{total} 个样本。
    stopped: 测试已停止，保留本次页面内已有样本。
    dashboard_title: 节点网络延迟
    quality_legend_label: P50 与波动阈值
    quality_thresholds:
      - label: P50
        bands:
          - quality: excellent
            label: "≤50 ms"
          - quality: good
            label: "≤100 ms"
          - quality: elevated
            label: "≤200 ms"
          - quality: unstable
            label: ">200 ms"
      - label: 波动
