  en:
    privacy: Test requests reveal your public IP, browser identifier, and request time to the corresponding providers. A complete test sends one warm-up plus 60 recorded requests to each node. Current-network details try IPIP.NET once, then IP.SB once only if the first source fails; the existing Cloudflare node response may provide an IP-only last fallback. This page stores no results, uses no cookies, localStorage, or sessionStorage, and does not continue testing in the background.
    visitor_title: Current network
    visitor_source_intro: "Sources are tried in order: "
    visitor_source_between: "; only after failure, "
    visitor_source_suffix: ". "
    visitor_source_current: "Used this time: "
    visitor_sources:
      ipip: IPIP.NET
      ipsb: IP.SB
      cloudflare: Cloudflare node (partial details only)
    visitor_fields:
      ip: Public IP / version
      network: Carrier / network
      region: Approximate region
      browser_connection: Browser estimate
    unavailable: Unavailable
    metric_placeholder: "—"
    test_start: Start test
    stop: Stop
    test_idle: Not started
    test_warming: Retrieving current network details and warming up 9 nodes concurrently…
    test_progress: Received {current}/{total} samples; {complete}/{nodes} nodes complete.
    test_done: All nodes complete; received {current}/{total} samples.
    stopped: Test stopped; samples already collected remain in this page.
    dashboard_title: Node network latency
    quality_legend_label: P50 and variation thresholds
    quality_thresholds:
      - label: P50
        bands:
          - quality: excellent
            label: "≤50 ms"
          - quality: good
            label: "≤100 ms"
          - quality: elevated
            label: "≤200 ms"
          - quality: unstable
            label: ">200 ms"
      - label: Variation
        bands:
          - quality: excellent
            label: "≤8 ms"
          - quality: good
            label: "≤20 ms"
          - quality: elevated
            label: "≤40 ms"
          - quality: unstable
            label: ">40 ms"
    core_metrics:
      p50: P50
      jitter: Variation
    diagnostics_title: Show details
    diagnostics_metrics_title: Live diagnostics
    diagnostics_node_title: Node source and characteristics
    diagnostics:
      grade: Overall reference
      latest: Latest sample
      samples: Success/measured
      p95: P95
      maximum: Maximum
      failures: Failures
      spikes: Spikes
    node_labels:
      location: Finest location
      network: Network type
      source: Source
      method: Measurement
      features: Characteristics
    providers:
      vultr:
        title: What is Vultr?
        description: Vultr is an international cloud provider launched by Constant in 2014; this page connects to its public Looking Glass.
        url: https://blogs.vultr.com/announcement-availability-of-NVIDIA-H100
        link_label: Official overview
    not_measured: Not measured
    stats:
      grade: Real-time traffic reference
      samples: Successful samples
      p50: P50
      p95: P95
      maximum: Maximum
      jitter: Adjacent variation
      failures: Failed requests
      spikes: Latency spikes
      longest_bad_streak: Longest abnormal streak
    grades:
      excellent: Excellent
      good: Good
      elevated: Elevated latency
      unstable: Unstable
      unavailable: Insufficient data
    chart_title: Consecutive latency for 9 nodes
    chart_description: HTTPS round-trip time for each node's successful samples; gaps represent failed requests. The horizontal axis is each node's own sample number.
    chart_legend_label: Node legend and latest values
    ms_value: "{value} ms"
    count_value: "{value}"
    sample_value: "{success}/{total}"
    failure_value: "{failures}/{total} ({rate}%)"
    spike_value: ">100 ms: {over100}; >200 ms: {over200}; >300 ms: {over300}"
    browser_rtt_value: "RTT {rtt}"
    browser_downlink_value: "Downlink {downlink}"
    browser_connection_unknown: Not provided by this browser
    request_failed: Request failed in this round
    all_failed: No successful samples
    source_link_label: Open source
    no_script: This checker requires JavaScript. With JavaScript disabled, it sends no request to any node.

nodes:
  - id: dnspod-anycast
    title:
      zh: 全球自动接入 · 腾讯 DNSPod
      en: Global automatic entry · Tencent DNSPod
    location:
      zh: 官方公开北京、上海、广州、中国香港和北美接入集群；本页无法识别实际落点
      en: Officially listed entry clusters in Beijing, Shanghai, Guangzhou, Hong Kong, and North America; the actual landing point is not visible here
    network:
      zh: 公共递归 DNS；BGP Anycast 多运营商接入
      en: Public recursive DNS; multi-carrier BGP Anycast access
    source_name: Tencent Cloud DNSPod Public DNS
    source_url: https://www.dnspod.cn/products/publicdns
    method:
      zh: DoH GET；小型 DNS 查询
      en: DoH GET; small DNS query
    features:
      zh: BGP Anycast 自动选路；可能接入大陆、中国香港或北美；响应对浏览器不透明，不能验证 HTTP 状态或实际落点
      en: BGP Anycast-selected and may enter Mainland China, Hong Kong, or North America; the browser response is opaque, so HTTP status and the actual PoP cannot be verified

  - id: alidns-global
    title:
      zh: 全球自动接入 · 阿里公共 DNS
      en: Global automatic entry · Alibaba Public DNS
    location:
      zh: 官方全球公共递归服务；公开多个国内城市及海外节点，本页无法识别实际落点
      en: Official global public recursive service with published domestic and overseas nodes; the actual landing point is not visible here
    network:
      zh: 全球公共递归 DNS；服务端自动调度
      en: Global public recursive DNS; service-directed entry
    source_name: Alibaba Public DNS
    source_url: https://alidns.com/
    method:
      zh: DoH GET；小型 DNS 查询
      en: DoH GET; small DNS query
    features:
      zh: 响应对浏览器不透明；可计时和识别传输失败，不能读取 HTTP 状态或实际落点
      en: Opaque browser response; timing and transport failures are visible, but HTTP status and actual PoP are not

  - id: cloudflare-nearest
    title:
      zh: 全球就近 · Cloudflare
      en: Global nearby · Cloudflare
    location:
      zh: Anycast 自动选择；本页无法读取实际接入城市
      en: Anycast-selected; the actual edge city is not readable here
    network:
      zh: Cloudflare 全球边缘网络
      en: Cloudflare global edge network
    source_name: Cloudflare Speedtest
    source_url: https://github.com/cloudflare/speedtest
    method:
      zh: 官方零字节下载端点
      en: Official zero-byte download endpoint
    features:
      zh: 可读取成功状态；实际边缘节点、中途运营商和回程线路未知
      en: Success status is readable; the actual edge, intermediate carriers, and return path are unknown

  - id: vultr-tokyo
    provider: vultr
    title:
      zh: 日本 · 东京 · Vultr
      en: Japan · Tokyo · Vultr
    location:
