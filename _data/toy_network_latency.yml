          - quality: excellent
            label: "≤8 ms"
          - quality: good
            label: "≤20 ms"
          - quality: elevated
            label: "≤40 ms"
          - quality: unstable
            label: ">40 ms"
    core_metrics:
      p50: P50
      jitter: 波动
    diagnostics_title: 查看详情
    diagnostics_metrics_title: 实时诊断
    diagnostics_node_title: 节点来源与特性
    diagnostics:
      grade: 综合参考
      latest: 当前样本
      samples: 成功/已测
      p95: P95
      maximum: 最大值
      failures: 失败
      spikes: 尖峰
    node_labels:
      location: 最细位置
      network: 网络类型
      source: 来源
      method: 测量方式
      features: 特性
    providers:
      hosthatch:
        title: HostHatch 是什么
        description: HostHatch 是国际云服务商；本页连接其公开 Looking Glass 健康端点。
        url: https://hosthatch.com/
        link_label: 官方网站
      akamai_linode:
        title: Akamai / Linode 是什么
        description: Akamai 提供云计算、网络安全和内容分发服务，并于 2022 年收购 Linode。本页连接的是 Akamai Cloud 的 Linode 逐地区测速主机，不是 CDN 就近边缘。
        url: https://www.akamai.com/cloud/speed-test
        link_label: 官方测速页
      vultr:
        title: Vultr 是什么
        description: Vultr 是 Constant 于 2014 年推出的国际云服务商；本页连接其公开 Looking Glass。
        url: https://blogs.vultr.com/announcement-availability-of-NVIDIA-H100
        link_label: 官方说明
