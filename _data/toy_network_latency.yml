    grades:
      excellent: 优秀
      good: 良好
      elevated: 延迟偏高
      unstable: 不稳定
      unavailable: 数据不足
    chart_title: 已启用节点的连续延迟
    chart_description: 各节点成功样本的 HTTPS 往返耗时；断线处表示请求失败。横轴为每个节点各自的采样序号。
    chart_legend_label: 节点图例与最新值
    ms_value: "{value} ms"
    count_value: "{value} 个"
    sample_value: "{success}/{total}"
    failure_value: "{failures}/{total}（{rate}%）"
    spike_value: ">100 ms：{over100}；>200 ms：{over200}；>300 ms：{over300}"
    browser_rtt_value: "RTT {rtt}"
    browser_downlink_value: "下行 {downlink}"
    browser_connection_unknown: 浏览器未提供
    request_failed: 本轮请求失败
    all_failed: 没有成功样本
    source_link_label: 打开来源
    no_script: 该检测器需要 JavaScript；禁用时不会向任何节点发送请求。
  en:
    privacy: Test requests reveal your public IP, browser identifier, and request time to the corresponding providers. A complete test sends one warm-up plus 60 recorded requests to each enabled node. Current-network details try IPIP.NET once, then IP.SB once only if the first source fails; when the Cloudflare node is enabled, its existing response may provide an IP-only last fallback. This page stores neither results nor node choices, uses no cookies, localStorage, or sessionStorage, and does not continue testing in the background.
    visitor_title: Current network
    visitor_source_intro: "Sources are tried in order: "
    visitor_source_between: "; only after failure, "
    visitor_source_suffix: ". "
    visitor_source_current: "Used this time: "
    visitor_sources:
      ipip: IPIP.NET
      ipsb: IP.SB
      cloudflare: Cloudflare node (partial details only)
    visitor_fields:
      ip: Public IP / version
      network: Carrier / network
      region: Approximate region
      browser_connection: Browser estimate
    unavailable: Unavailable
    metric_placeholder: "—"
    test_start: Start test
    stop: Stop
    test_idle: Not started
    test_warming: Retrieving current network details and warming up {nodes} nodes concurrently…
    selection_title: Node selection
    selection_count: "{selected}/{total} enabled"
    selection_default: Restore defaults
    selection_all: Select all
    selection_none: Clear
    selection_empty: Enable at least one node.
    node_groups:
      automatic: Automatic entry
      asia: Asia
      oceania: Oceania
      europe: Europe
      north_america: North America
      south_america: South America
      africa: Africa
    test_progress: Received {current}/{total} samples; {complete}/{nodes} nodes complete.
    test_done: All nodes complete; received {current}/{total} samples.
    stopped: Test stopped; samples already collected remain in this page.
    dashboard_title: Node network latency
    quality_legend_label: P50 and variation thresholds
    quality_thresholds:
      - label: P50
        bands:
          - quality: excellent
            label: "≤50 ms"
          - quality: good
            label: "≤100 ms"
          - quality: elevated
            label: "≤200 ms"
          - quality: unstable
            label: ">200 ms"
      - label: Variation
        bands:
          - quality: excellent
            label: "≤8 ms"
          - quality: good
            label: "≤20 ms"
          - quality: elevated
            label: "≤40 ms"
          - quality: unstable
            label: ">40 ms"
    core_metrics:
      p50: P50
      jitter: Variation
    diagnostics_title: Show details
    diagnostics_metrics_title: Live diagnostics
    diagnostics_node_title: Node source and characteristics
    diagnostics:
      grade: Overall reference
      latest: Latest sample
      samples: Success/measured
      p95: P95
      maximum: Maximum
      failures: Failures
      spikes: Spikes
    node_labels:
      location: Finest location
      network: Network type
      source: Source
      method: Measurement
      features: Characteristics
    providers:
      hosthatch:
        title: What is HostHatch?
        description: HostHatch is an international cloud provider; this page connects to its public Looking Glass health endpoints.
        url: https://hosthatch.com/
        link_label: Official website
      akamai_linode:
        title: What are Akamai / Linode?
        description: Akamai provides cloud computing, cybersecurity, and content delivery, and acquired Linode in 2022. These are regional Linode speed-test hosts for Akamai Cloud, not nearby CDN edges.
        url: https://www.akamai.com/cloud/speed-test
        link_label: Official speed-test page
      vultr:
        title: What is Vultr?
        description: Vultr is an international cloud provider launched by Constant in 2014; this page connects to its public Looking Glass.
        url: https://blogs.vultr.com/announcement-availability-of-NVIDIA-H100
        link_label: Official overview
    not_measured: Not measured
    stats:
      grade: Real-time traffic reference
      samples: Successful samples
      p50: P50
      p95: P95
      maximum: Maximum
      jitter: Adjacent variation
      failures: Failed requests
      spikes: Latency spikes
      longest_bad_streak: Longest abnormal streak
    grades:
      excellent: Excellent
      good: Good
      elevated: Elevated latency
      unstable: Unstable
      unavailable: Insufficient data
