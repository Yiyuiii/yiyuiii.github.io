copy:
  zh:
    privacy: 测试请求会把你的公网 IP、浏览器标识和请求时间发送给对应服务商。一次完整测试对每个节点发送 1 次预热和 60 次采样请求；当前网络信息先请求一次 IPIP.NET，只有失败时才请求一次 IP.SB，Cloudflare 节点的原有响应可作为仅含 IP 的最后补充。页面不保存测试结果，不使用 Cookie、localStorage 或 sessionStorage，也不会后台续测。
    visitor_title: 当前网络
    visitor_source_intro: "来源依次尝试 "
    visitor_source_between: "，失败后才尝试 "
    visitor_source_suffix: 。
    visitor_source_current: 本次采用：
    visitor_sources:
      ipip: IPIP.NET
      ipsb: IP.SB
      cloudflare: Cloudflare 节点（仅部分信息）
    visitor_fields:
      ip: 公网 IP / 版本
      network: 运营商 / 网络
      region: 近似地区
      browser_connection: 浏览器估计
    unavailable: 无法获取
    metric_placeholder: "—"
    test_start: 开始测试
    stop: 停止
    test_idle: 尚未开始
    test_warming: 正在并发获取当前网络信息并预热 9 个节点……
    test_progress: 已收到 {current}/{total} 个样本；{complete}/{nodes} 个节点完成。
    test_done: 全部节点测试完成，共收到 {current}/{total} 个样本。
    stopped: 测试已停止，保留本次页面内已有样本。
    dashboard_title: 节点网络延迟
    quality_legend_label: P50 与波动阈值
    quality_thresholds:
      - label: P50
        bands:
          - quality: excellent
            label: "≤50 ms"
          - quality: good
            label: "≤100 ms"
          - quality: elevated
            label: "≤200 ms"
          - quality: unstable
            label: ">200 ms"
      - label: 波动
        bands:
          - quality: excellent
            label: "≤8 ms"
          - quality: good
            label: "≤20 ms"
          - quality: elevated
            label: "≤40 ms"
          - quality: unstable
            label: ">40 ms"
    core_metrics:
      p50: P50
      jitter: 波动
    diagnostics_title: 查看详情
    diagnostics_metrics_title: 实时诊断
    diagnostics_node_title: 节点来源与特性
    diagnostics:
      grade: 综合参考
      latest: 当前样本
      samples: 成功/已测
      p95: P95
      maximum: 最大值
      failures: 失败
      spikes: 尖峰
    node_labels:
      location: 最细位置
      network: 网络类型
      source: 来源
      method: 测量方式
      features: 特性
    providers:
      vultr:
        title: Vultr 是什么
        description: Vultr 是 Constant 于 2014 年推出的国际云服务商；本页连接其公开 Looking Glass。
        url: https://blogs.vultr.com/announcement-availability-of-NVIDIA-H100
        link_label: 官方说明
    not_measured: 尚未测量
    stats:
      grade: 实时业务参考
      samples: 成功样本
      p50: P50
      p95: P95
      maximum: 最大值
      jitter: 相邻波动
      failures: 请求失败
      spikes: 延迟尖峰
      longest_bad_streak: 最长异常连续段
    grades:
      excellent: 优秀
      good: 良好
      elevated: 延迟偏高
      unstable: 不稳定
      unavailable: 数据不足
    chart_title: 9 个节点的连续延迟
    chart_description: 各节点成功样本的 HTTPS 往返耗时；断线处表示请求失败。横轴为每个节点各自的采样序号。
    chart_legend_label: 节点图例与最新值
    ms_value: "{value} ms"
    count_value: "{value} 个"
    sample_value: "{success}/{total}"
    failure_value: "{failures}/{total}（{rate}%）"
    spike_value: ">100 ms：{over100}；>200 ms：{over200}；>300 ms：{over300}"
    browser_rtt_value: "RTT {rtt}"
    browser_downlink_value: "下行 {downlink}"
