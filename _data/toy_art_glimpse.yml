  en:
    instructions: Guess in either direction between a museum card and a complete artwork; choose the formats and whether cards show the title, artist, or date.
    privacy: Starting a round sends one small-batch GET to the Cleveland Museum of Art Open Access API, using a shallow random offset among CC0 landscape paintings with complete title, artist, date, and image data. “Museum card → image” loads four roughly 900px JPEGs from the official image CDN; “image → museum card” loads only the one image needed as the clue. It does not continue, refill the batch, or prefetch another round. The open collection may still include religious, mythological, or nonsexual human figures; text screening cannot exclude them completely. The museum and its service providers can see the requests and your IP address; the API can also see this site's Origin, while image requests do not send this page as a referrer. Responses stay only in this page's memory; this site uses no cookies or persistent storage for the game.
    start: Start a round
    again: Another round
    retry: Try again
    loading_metadata: Discovering this round in the museum's open collection…
    loading_images:
      metadata_to_image: Loading the four museum images for this round…
      image_to_metadata: Loading the museum image for this round…
    prompts:
      metadata_to_image: Which artwork matches this museum card?
      image_to_metadata: Which museum card matches this artwork?
    settings_title: Game settings
    settings_adjust: Adjust
    settings_all: Both formats
    settings_summary: "{types} · {clues}"
    settings_legend: Enabled formats
    settings_help: Each round randomly uses an enabled format. Settings last only for this page.
    clue_settings_legend: Museum information shown
    clue_settings_help: The same fields are used for the card-to-art clue and the art-to-card choices. Keep at least one.
    clue_setting_labels:
      title: Title
      creator: Artist
      date: Date
    clue_settings_separator: ", "
    settings_apply: Apply settings
    settings_reset: Restore defaults
    settings_applied: Game settings applied; the next round will use them.
    settings_defaults_ready: "Defaults restored: both formats with title and artist; apply to confirm."
    settings_required: Select at least one format.
    clue_settings_required: Show at least one of title, artist, or date.
    type_labels:
      metadata_to_image: Find art from a card
      image_to_metadata: Find a card from art
    clue_title_label: Title (as catalogued)
    clue_artist_label: Artist
    clue_date_label: Date
    options_labels:
      metadata_to_image: Four candidate museum images
      image_to_metadata: Four candidate museum cards
    choice_label: Choose candidate artwork {number}
    choice_image_alt: Candidate artwork {number}
    clue_image_alt: Artwork clue for this round
    metadata_choice_label: "Choose museum card {number}: {details}"
    metadata_detail_label: "{label}: {value}"
    feedback:
      metadata_to_image:
        correct: Correct! You found “{title}”.
        incorrect: Not quite; the correct image for “{title}” is marked.
      image_to_metadata:
        correct: Correct! This artwork is “{title}”.
        incorrect: Not quite; this artwork is “{title}”.
    correct_badge: Answer
    selected_badge: Your choice
    no_question: This small batch did not contain four distinct eligible choices for the current formats and museum fields. You can choose to try again.
    network_error: The collection data could not be retrieved just now. Please try again later.
    image_errors:
      metadata_to_image: Not all four museum images loaded for this round. You can choose to try again.
      image_to_metadata: The museum image for this round did not load. You can choose to try again.
    random_error: This browser cannot provide secure randomness, so a round cannot be created.
    reveal_label: Artwork in this round
    unknown_artist: Unknown artist
    unknown_date: Date unknown
    source_label: Open “{title}” at the Cleveland Museum of Art
    attribution: Artwork metadata and images are provided through the Cleveland Museum of Art Open Access program. The prompt shows only the museum fields enabled in Game settings or the complete image, while the reveal restores the full record. This page does not save images or attempts.
    license_label: Read the CC0 1.0 public-domain dedication
    open_access_label: Read the museum's Open Access statement
    no_js: This toy needs JavaScript. With JavaScript disabled, it does not contact the museum API or image service.
