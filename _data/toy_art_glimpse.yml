reviewed_on: "2026-08-06"
endpoint: https://openaccess-api.clevelandart.org/api/artworks/
api_host: openaccess-api.clevelandart.org
image_host: openaccess-cdn.clevelandart.org
artwork_hosts:
  - clevelandart.org
  - www.clevelandart.org
license_url: https://creativecommons.org/publicdomain/zero/1.0/
open_access_url: https://www.clevelandart.org/open-access
query: landscape
artwork_type: Painting
batch_size: 12
candidate_count: 4
safe_skip_max: 300
timeout_ms: 12000
image_timeout_ms: 10000
max_response_chars: 262144
max_image_bytes: 1200000
max_round_image_bytes: 4000000

# 仅保存固定配置与双语界面文案。作品元数据和图片不进入仓库，也不持久化到
# 浏览器；玩家每次明确开始后才会触发一次元数据请求，并按题型加载本局一张或四张 web JPEG。
copy:
  zh:
    instructions: 在馆藏名片与完整画面之间双向猜题；题型和名片显示的题名、作者、年代都可自行选择。
    privacy: 点击开始后，本页会向克利夫兰艺术博物馆开放接口发送一次小批量 GET，从带图且题名、作者、年代完整的 CC0 风景绘画中以随机浅偏移取得本题候选；“馆藏名片 → 画面”会从官方图片 CDN 加载四幅约 900px 的 JPEG，“画面 → 馆藏名片”只加载题目所需的一幅。不会续页、补请求或预取下一题。开放馆藏仍可能出现宗教、神话或非色情人体形象，文字筛选不能完全排除。博物馆及其服务商可看到请求和你的 IP，API 还可看到本站 Origin；图片不发送本页来源地址。响应只留在当前页面内存，本站不使用 Cookie 或持久化存储。
