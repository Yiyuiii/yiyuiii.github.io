reviewed_on: "2026-08-05"
endpoint: https://openaccess-api.clevelandart.org/api/artworks/
api_host: openaccess-api.clevelandart.org
image_host: openaccess-cdn.clevelandart.org
artwork_hosts:
  - clevelandart.org
  - www.clevelandart.org
license_url: https://creativecommons.org/publicdomain/zero/1.0/
open_access_url: https://www.clevelandart.org/open-access
query: landscape
artwork_type: Painting
batch_size: 12
candidate_count: 4
safe_skip_max: 300
timeout_ms: 12000
image_timeout_ms: 10000
max_response_chars: 262144
max_image_bytes: 1200000
max_round_image_bytes: 4000000

# 仅保存固定配置与双语界面文案。作品元数据和图片不进入仓库，也不持久化到
# 浏览器；玩家每次明确开始后才会触发一次元数据请求和本局四张 web JPEG。
copy:
  zh:
    instructions: 先看一块放大的画面局部，再从四幅完整馆藏图中找出它来自哪一幅。
    privacy: 点击开始后，本页会向克利夫兰艺术博物馆开放接口发送一次小批量 GET，从带图的 CC0 风景绘画中以随机浅偏移取得本题候选，并向其官方图片 CDN 加载最终四幅约 900px 的 JPEG；不会续页、补请求或预取下一题。开放馆藏仍可能出现宗教、神话或非色情人体形象，文字筛选不能完全排除。博物馆及其服务商可看到请求和你的 IP，API 还可看到本站 Origin；图片不发送本页来源地址。响应只留在当前页面内存，本站不使用 Cookie 或持久化存储。
    start: 开始一题
    again: 再来一题
    retry: 重试
    loading_metadata: 正在从博物馆开放馆藏中发现本题……
    loading_images: 正在加载本题的四幅馆藏图……
    prompt: 这块局部来自哪一幅？
    options_label: 四幅候选馆藏图
    choice_label: 选择候选作品 {number}
    choice_image_alt: 候选作品 {number}
    correct: 找到了！
    incorrect: 没猜中；正确作品已标出。
    correct_badge: 答案
    selected_badge: 你的选择
    no_question: 本次小批结果不足以组成四幅合格作品；可由你主动重试。
    network_error: 暂时没能取得馆藏资料，请稍后重试。
    image_error: 本题的馆藏图片没有全部载入；可由你主动重试。
    random_error: 当前浏览器无法提供可靠随机数，暂时不能出题。
    reveal_label: 本题作品
    unknown_artist: 作者不详
    unknown_date: 年代不详
    source_label: 在克利夫兰艺术博物馆查看《{title}》
    attribution: 作品元数据与图片由克利夫兰艺术博物馆开放获取计划提供；本页仅把已加载的答案图绘制为放大局部线索，不读取、导出或保存画布与图片。
    license_label: 查看 CC0 1.0 公共领域贡献声明
    open_access_label: 查看博物馆开放获取说明
    no_js: 此小玩意需要 JavaScript；未启用时不会连接博物馆接口或图片服务。
  en:
    instructions: Study one enlarged detail, then find the full museum image it came from among four choices.
    privacy: Starting a round sends one small-batch GET to the Cleveland Museum of Art Open Access API, using a shallow random offset among CC0 landscape paintings with images, and loads the final four roughly 900px JPEGs from its official image CDN. It does not continue, refill the batch, or prefetch another round. The open collection may still include religious, mythological, or nonsexual human figures; text screening cannot exclude them completely. The museum and its service providers can see the requests and your IP address; the API can also see this site's Origin, while image requests do not send this page as a referrer. Responses stay only in this page's memory; this site uses no cookies or persistent storage for the game.
    start: Start a round
    again: Another round
    retry: Try again
    loading_metadata: Discovering this round in the museum's open collection…
    loading_images: Loading the four museum images for this round…
    prompt: Which full image contains this detail?
    options_label: Four candidate museum images
    choice_label: Choose candidate artwork {number}
    choice_image_alt: Candidate artwork {number}
    correct: You found it!
    incorrect: Not quite; the correct artwork is marked.
    correct_badge: Answer
    selected_badge: Your choice
    no_question: This small batch did not contain four eligible artworks. You can choose to try again.
    network_error: The collection data could not be retrieved just now. Please try again later.
    image_error: Not all four museum images loaded for this round. You can choose to try again.
    random_error: This browser cannot provide secure randomness, so a round cannot be created.
    reveal_label: Artwork in this round
    unknown_artist: Unknown artist
    unknown_date: Date unknown
    source_label: Open “{title}” at the Cleveland Museum of Art
    attribution: Artwork metadata and images are provided through the Cleveland Museum of Art Open Access program. This page only draws the already loaded answer image as an enlarged detail; it does not read, export, or save the canvas or images.
    license_label: Read the CC0 1.0 public-domain dedication
    open_access_label: Read the museum's Open Access statement
    no_js: This toy needs JavaScript. With JavaScript disabled, it does not contact the museum API or image service.
