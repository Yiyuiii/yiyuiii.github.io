api_endpoint: https://zh.moegirl.org.cn/api.php
timeout_ms: 10000
batch_size: 50
recent_history_size: 24
reviewed_on: "2026-08-03"

# 每轮只向官方 Action API 请求一次随机主名字空间条目。浏览器随后在本地筛选
# 角色型、非敏感且未在当前会话近期出现的条目，不抓取页面，也不请求图片。
copy:
  zh:
    eyebrow: 萌娘百科条目猜猜
    title: 根据线索，猜猜这是哪个条目？
    description: 看完线索，你能从四个条目中猜出答案吗？
    privacy: 点击开始后，本页只会向萌娘百科 API 请求一次，取得一批随机条目的纯文字导言与分类，再在浏览器本地筛选本题，并将线索中可识别的条目标题片段替换为 ⬛。萌娘百科可看到这次请求和你的 IP 地址；本站不使用 Cookie、持久化存储或跟踪，也不请求图片。
    start: 开始一题
    again: 再来一题
    retry: 重试
    loading: 正在向萌娘百科随机发现本题候选……
    options_label: 候选条目
    clue_label: 这是哪个条目？
    redaction: ⬛
    correct: 答对了！这是 {title}。
    incorrect: 没猜中；答案是 {title}。
    network_error: 暂时没能取得文字线索，请稍后重试。
    no_clue_error: 本次随机结果里没有足够的合适条目线索，请再试一次。
    random_error: 浏览器无法提供可靠随机数，暂时不能出题。
    source_label: "查看萌娘百科来源条目：{title}"
    license: 线索是上方来源条目的匿名化节选；条目文本按来源页标示的许可协议提供，再次使用时请保留来源与署名。
    license_label: 查看 CC BY-NC-SA 3.0 协议
    no_js: 此小玩意需要 JavaScript；未启用时不会连接萌娘百科。
  en:
    eyebrow: Moegirlpedia entry quiz
    title: Which entry is this?
    description: Read the Chinese clue and pick the matching entry.
    privacy: Starting a round makes one request to the Chinese Moegirlpedia API for a random batch of text introductions and categories. This page filters the round locally and replaces recognizable entry-title fragments in the Chinese clue with ⬛. Moegirlpedia can see the request and your IP address; this site uses no cookies, persistent storage, tracking, or images.
    start: Start a round
    again: Another round
    retry: Try again
    loading: Discovering this round's candidates on Moegirlpedia…
    options_label: Candidate entries
    clue_label: Which entry is this?
    redaction: ⬛
    correct: Correct! This is {title}.
    incorrect: Not quite; the answer is {title}.
    network_error: The text clue could not be retrieved just now. Please try again later.
    no_clue_error: This random batch did not contain enough suitable entry clues. Please try again.
    random_error: This browser cannot provide secure randomness, so a round cannot be created.
    source_label: "Open the source entry on Moegirlpedia: {title}"
    license: The clue is an anonymized excerpt from the source entry above. Its text follows the license shown on that page; preserve the source and attribution when reusing it.
    license_label: Read the CC BY-NC-SA 3.0 license
    no_js: This toy needs JavaScript. With JavaScript disabled, it does not connect to Moegirlpedia.
