zh:
  title: 你好 👋
  introduction:
    - 这里是我的博客，记录随笔、项目、论文和一些好玩的东西。
  guide:
    label: 页面指引
    items:
      - target: sunlight
        text: 点击左上角头像，开关日光 / 月光背景
      - target: navigation
        text: 点击顶部导航，浏览不同栏目
      - target: search
        text: 点击右上角 🔍，搜索站内内容
      - target: language
        text: Looking for English? Click “EN” in the upper-right corner.
      - target: theme
        text: 点击右上角的 🌙 / ☀️，切换明亮 / 夜晚样式
  sections:
    rotation: 随机发现
    rotation_fallback: 浏览起点
    recent: 最近更新
  types:
    writing: 随笔
    project: 项目
    publication: 论文
  date_format: "%Y.%m.%d"
  external_label: 在新窗口打开外部页面
  legacy_tag_noscript: 旧标签筛选地址需要 JavaScript 自动迁移；你仍可前往随笔索引继续浏览。

en:
  title: Hello 👋
  introduction:
    - This is my blog—a place for writing, projects, papers, and a few things I make for fun.
  guide:
    label: Page guide
    items:
      - target: sunlight
        text: Click the avatar at top left to turn the sunlight or moonlight background on or off
      - target: navigation
        text: Use the navigation at the top to browse different sections
      - target: search
        text: Click 🔍 at top right to search the site
      - target: language
        text: 想看中文？点击右上角的“中”。
      - target: theme
        text: Click 🌙 / ☀️ at top right to switch between light and night modes
  sections:
    rotation: Random discovery
    rotation_fallback: A place to start
    recent: Recent updates
  types:
    writing: Writing
    project: Project
    publication: Paper
  date_format: "%Y-%m-%d"
  external_label: Open the external page in a new window
  legacy_tag_noscript: The old tag-filter URL needs JavaScript to migrate automatically; you can still continue from the Writing index.
