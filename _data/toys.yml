page:
  zh:
    introduction: 点开玩~
    loading: 正在载入这个项目的本站脚本……
    load_error: 暂时无法载入这个项目的本站脚本。
    retry: 重试载入
  en:
    introduction: A few lightweight interactions to open, try, and leave at any time.
    loading: Loading this toy's local scripts…
    load_error: This toy's local scripts could not be loaded.
    retry: Retry loading

groups:
  - id: database
    title:
      zh: 知识问答
      en: Knowledge quizzes
    items:
      - id: moegirl-quiz
        title:
          zh: 萌娘百科猜猜
          en: Moegirlpedia quiz
        description:
          zh: 读读匿名化的导言，看看四个候选里谁是答案。
          en: Read the Chinese anonymized introduction and choose the matching entry.
        keywords:
          zh: [百科, 萌娘百科, 条目, 问答]
          en: [encyclopedia, Moegirlpedia, Chinese, entry, quiz]

      - id: art-glimpse
        title:
          zh: 名画猜猜（克利夫兰艺术博物馆）
          en: Artwork quiz (Cleveland Museum of Art)
        description:
          zh: 可选择猜题方向，以及题名、作者、年代等线索。
          en: Choose the quiz direction and whether to show title, artist, or date.
        keywords:
          zh: [名画, 配对, 艺术, 博物馆, 克利夫兰, 图像, 猜题]
          en: [art, matching, painting, museum, Cleveland, image, quiz]

      - id: anilist-role-quiz
        title:
          zh: 动画主角猜猜（AniList）
          en: Anime protagonist quiz (AniList)
        description:
          zh: 可选择动画找主角、主角找动画或同作主角配对。
          en: Choose among three four-choice links between anime and their main characters.
        keywords:
          zh: [AniList, 动画, 角色, 主角, 关系, 猜题]
          en: [AniList, anime, character, main role, relation, quiz]

  - id: quick-challenges
    title:
      zh: 轻松挑战
      en: Quick challenges
    items:
      - id: color-challenge
        title:
          zh: 色差挑战
          en: Color difference challenge
        description:
          zh: 找出颜色略有不同的方块，看看你能走到第几关。
          en: Find the subtly different tile and see how far you can go.
        keywords:
          zh: [颜色, 视觉, 辨识, 挑战]
          en: [color, vision, perception, challenge]

      - id: ten-second
        title:
          zh: 盲估十秒
          en: Ten-second estimate
        description:
          zh: 不看计时器，凭感觉停在十秒附近。
          en: Stop as close to ten seconds as you can without watching a timer.
        keywords:
          zh: [十秒, 时间, 直觉, 挑战]
          en: [ten seconds, time, intuition, challenge]

      - id: reaction-time
        title:
          zh: 反应时间
          en: Reaction time
        description:
          zh: 等待信号出现后尽快作出反应。
          en: Wait for the signal, then respond as quickly as possible.
        keywords:
          zh: [反应, 时间, 速度, 挑战]
          en: [reaction, time, speed, challenge]

  - id: logic-puzzles
    title:
      zh: 逻辑谜题
      en: Logic puzzles
    items:
      - id: codebreaker
        title:
          zh: 数字 Wordle
          en: Number Wordle
        description:
          zh: 根据“完全命中”和“仅数字命中”，逐步排除隐藏答案。
          en: Use exact and digit-only matches to deduce the hidden number code.
        keywords:
          zh: [数字 Wordle, 数字码, 推理, 排除, 逻辑, 游戏]
          en: [number Wordle, codebreaker, deduction, logic, numbers, game]

      - id: make-24
        title:
          zh: 凑成 24
          en: Make 24
        description:
          zh: 四个数各用一次，选择运算顺序，让最后的精确结果等于 24。
          en: Use each of four numbers once and combine them to make exactly 24.
        keywords:
          zh: [凑成 24, 四则运算, 分数, 心算, 逻辑, 游戏]
          en: [make 24, arithmetic, fractions, mental math, logic, game]

      - id: lights-out
        title:
          zh: 翻灯
          en: Lights Out
        description:
          zh: 每次翻转一格和它的四邻格，用尽量清晰的规划让所有灯熄灭。
          en: Flip a cell and its neighbours, then plan a route to turn every light off.
        keywords:
          zh: [翻灯, 网格, 最短步数, 规划, 逻辑, 游戏]
          en: [lights out, grid, minimum moves, planning, logic, game]

  - id: random-generators
    title:
      zh: 随机生成
      en: Random generators
    items:
      - id: random-password
        title:
          zh: 随机密码
          en: Random password
        description:
          zh: 在当前浏览器中生成可调整的随机密码。
          en: Generate a configurable random password in your browser.
        keywords:
          zh: [随机, 密码, 安全, 生成器]
          en: [random, password, security, generator]

      - id: random-number
        title:
          zh: 随机数字
          en: Random numbers
        description:
          zh: 从指定整数范围中生成一个或多个随机结果。
          en: Generate one or more random results from an integer range.
        keywords:
          zh: [随机, 数字, 整数, 生成器]
          en: [random, number, integer, generator]
