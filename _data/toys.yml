page:
  zh:
    eyebrow: 轻量互动
    title: 小玩意
    introduction: 这里收纳几秒钟就能上手的站内功能与轻量实验。首批只列出已经可以使用的互动；以后新增内容时，继续在这份清单中维护。
    available: 现在可用
  en:
    eyebrow: Lightweight interactions
    title: Toys
    introduction: A home for small site features and lightweight experiments that take only a few seconds to try. This first collection lists interactions that already work; future additions stay in this same manifest.
    available: Available now

items:
  - id: random-discovery
    kind:
      zh: 站内发现
      en: Site discovery
    title:
      zh: 随机发现
      en: Random discovery
    description:
      zh: 每次进入欢迎页时，从最近发布之外的双语随笔、项目和论文中等概率抽出一项；不记录访问，也不请求外部服务。
      en: Each welcome-page visit draws uniformly from bilingual writing, projects, and papers outside the recently published list, without visit tracking or external requests.
    action:
      zh: 去欢迎页抽一次
      en: Draw on the welcome page
    keywords:
      zh: [随机, 推荐, 内容发现]
      en: [random, recommendation, discovery]
    href:
      zh: /
      en: /en/
    external: false

  - id: theme-and-light
    kind:
      zh: 页面氛围
      en: Page ambience
    title:
      zh: 明暗主题与日月光效
      en: Light, dark, sunlight, and moonlight
    description:
      zh: 用页眉按钮切换明亮或夜晚主题，点击左上头像独立开关随主题变化的日光或月光；你的选择只保存在当前浏览器。
      en: Switch between light and dark themes from the header, then click the upper-left avatar to toggle matching sunlight or moonlight independently. Your choices stay only in this browser.
    action:
      zh: 在页眉中直接试试
      en: Try it directly in the header
    keywords:
      zh: [主题, 阳光, 月光, 背景]
      en: [theme, sunlight, moonlight, background]
    href: null
    external: false
