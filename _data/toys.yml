page:
  zh:
    introduction: 点开玩~
  en:
    introduction: A few lightweight interactions to open, try, and leave at any time.

groups:
  - id: ungrouped
    title: null
    items:
      - id: moegirl-quiz
        title:
          zh: 萌娘百科条目猜猜
          en: Moegirlpedia entry quiz
        description:
          zh: 看完线索，你能从四个条目中猜出答案吗？
          en: Read the Chinese clue and pick the matching entry.
        keywords:
          zh: [萌娘百科, 条目, 问答, 动漫, 游戏]
          en: [Moegirlpedia, entry, quiz, anime, games]

  - id: quick-challenges
    title:
      zh: 轻松挑战
      en: Quick challenges
    items:
      - id: color-challenge
        title:
          zh: 色差挑战
          en: Color difference challenge
        description:
          zh: 找出颜色略有不同的方块，看看你能走到第几关。
          en: Find the subtly different tile and see how far you can go.
        keywords:
          zh: [颜色, 视觉, 辨识, 挑战]
          en: [color, vision, perception, challenge]

      - id: ten-second
        title:
          zh: 盲估十秒
          en: Ten-second estimate
        description:
          zh: 不看计时器，凭感觉停在十秒附近。
          en: Stop as close to ten seconds as you can without watching a timer.
        keywords:
          zh: [十秒, 时间, 直觉, 挑战]
          en: [ten seconds, time, intuition, challenge]

      - id: reaction-time
        title:
          zh: 反应时间
          en: Reaction time
        description:
          zh: 等待信号出现后尽快作出反应。
          en: Wait for the signal, then respond as quickly as possible.
        keywords:
          zh: [反应, 时间, 速度, 挑战]
          en: [reaction, time, speed, challenge]

  - id: logic-puzzles
    title:
      zh: 逻辑谜题
      en: Logic puzzles
    items:
      - id: codebreaker
        title:
          zh: 破译数字码
          en: Codebreaker
        description:
          zh: 根据位置与数字命中数，逐步排除隐藏答案。
          en: Use exact and misplaced matches to deduce the hidden number code.
        keywords:
          zh: [数字码, 推理, 排除, 逻辑, 游戏]
          en: [codebreaker, deduction, logic, numbers, game]

  - id: random-generators
    title:
      zh: 随机生成
      en: Random generators
    items:
      - id: random-password
        title:
          zh: 随机密码
          en: Random password
        description:
          zh: 在当前浏览器中生成可调整的随机密码。
          en: Generate a configurable random password in your browser.
        keywords:
          zh: [随机, 密码, 安全, 生成器]
          en: [random, password, security, generator]

      - id: random-number
        title:
          zh: 随机数字
          en: Random numbers
        description:
          zh: 从指定整数范围中生成一个或多个随机结果。
          en: Generate one or more random results from an integer range.
        keywords:
          zh: [随机, 数字, 整数, 生成器]
          en: [random, number, integer, generator]
