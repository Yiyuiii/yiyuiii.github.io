title: yiyuiii
first_name: Yiyu
middle_name: null
last_name: Chen
contact_note: ''
description: yiyuiii 的随笔、公开项目与合作论文。
footer_text: ''
keywords: yiyuiii, 随笔, 开源项目, 复杂系统
lang: zh-CN
timezone: Asia/Hong_Kong
icon: favicons/favicon.ico
url: https://yiyuiii.github.io
baseurl: ''
last_updated: false
impressum_path: null
back_to_top: false
repo_theme_light: default
repo_theme_dark: dark
repo_trophies:
  enabled: false
  theme_light: flat
  theme_dark: gitdimmed
external_services:
  github_readme_stats_url: https://github-readme-stats.vercel.app
  github_profile_trophy_url: https://github-profile-trophy.vercel.app
al_folio:
  api_version: 1
  style_engine: tailwind
  tailwind:
    version: 4.1.18
    preflight: false
    css_entry: assets/tailwind/app.css
  distill:
    engine: distillpub-template
    source: al-org-dev/distill-template#al-folio
    allow_remote_loader: true
  features:
    cv:
      enabled: false
    distill:
      enabled: false
  compat:
    bootstrap:
      enabled: false
      support_window: v1.0-v1.2
      deprecates_in: v1.3
      removed_in: v2.0
  upgrade:
    channel: stable
    auto_apply_safe_fixes: false
navbar_fixed: true
footer_fixed: false
search_enabled: true
socials_in_search: true
posts_in_search: true
bib_search: false
max_width: 960px
serve_og_meta: false
serve_schema_org: false
og_image: /assets/img/favicons/android-chrome-256x256.png
analytics:
  google: null
  cronitor: null
  pirsch: null
  openpanel: null
google_site_verification: null
bing_site_verification: null
blog_name: Writing
blog_description: ''
permalink: /posts/:title/
lsi: false
pagination:
  enabled: false
related_blog_posts:
  enabled: false
  max_related: 5
giscus:
  repo: Yiyuiii/yiyuiii.github.io
  repo_id: null
  category: Comments
  category_id: null
  mapping: title
  strict: 1
  reactions_enabled: 1
  input_position: bottom
  dark_theme: dark
  light_theme: light
  emit_metadata: 0
  lang: en
disqus_shortname: null
external_sources: []
newsletter:
  enabled: false
  endpoint: null
collections:
  news:
    defaults:
      layout: post
    output: true
markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  syntax_highlighter_opts:
    css_class: highlight
    span:
      line_numbers: false
    block:
      line_numbers: false
      start_line: 1
include:
- _pages
exclude:
- AGENTS.md
- al-folio-upgrade-report.md
- bin/
- CONTRIBUTING.md
- CUSTOMIZE.md
- Dockerfile
- docker-compose.yml
- docker-compose-slim.yml
- docs/
- FAQ.md
- Gemfile
- Gemfile.lock
- INSTALL.md
- LICENSE
- lighthouse_results/
- package.json
- package-lock.json
- _pages/about_einstein.md
- purgecss.config.js
- README.md
- readme_preview/
- scripts/
- tests/
- gems/
- migrations/
- vendor
keep_files:
- CNAME
- .nojekyll
theme: al_folio_core
plugins:
- jekyll-3rd-party-libraries
- jekyll-archives-v2
- jekyll-cache-bust
- jekyll-email-protect
- jekyll-feed
- jekyll-get-json
- jekyll-imagemagick
- jekyll-jupyter-notebook
- jekyll-link-attributes
- jekyll-minifier
- jekyll-paginate-v2
- jekyll-regex-replace
- jekyll-sitemap
- jekyll-socials
- jekyll-tabs
- jekyll-terser
- jekyll-toc
- jekyll-twitter-plugin
- jemoji
- al_folio_core
- al_icons
- al_folio_cv
- al_folio_distill
- al_folio_upgrade
- al_folio_bootstrap_compat
- al_cookie
- al_analytics
- al_ext_posts
- al_img_tools
- al_charts
- al_math
- al_comments
- al_newsletter
defaults:
- scope:
    path: ''
    type: posts
  values:
    layout: post
    giscus_comments: false
    related_posts: false
    toc:
      beginning: false
- scope:
    path: assets
  values:
    sitemap: false
sass:
  style: compressed
jekyll-minifier:
  compress_javascript: false
  compress_css: false
  exclude:
  - robots.txt
terser:
  compress:
    drop_console: true
jekyll-archives:
  posts:
    enabled:
    - year
    - tags
    - categories
    permalinks:
      year: /blog/:year/
      tags: /tags/:name/
      categories: /categories/:name/
external_links:
  enabled: true
  rel: external nofollow noopener
  target: _blank
  exclude: null
imagemagick:
  enabled: true
  widths:
  - 480
  - 800
  - 1400
  input_directories:
  - assets/img/
  input_formats:
  - .jpg
  - .jpeg
  - .png
  - .tiff
  - .gif
  output_formats:
    webp: -auto-orient -quality 85
lazy_loading_images: true
enable_google_verification: false
enable_bing_verification: false
enable_cookie_consent: false
enable_masonry: false
enable_math: true
enable_tooltips: false
enable_darkmode: false
enable_navbar_social: false
enable_project_categories: false
enable_medium_zoom: true
enable_progressbar: false
enable_video_embedding: false
