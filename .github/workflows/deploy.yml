name: Build and deploy site

on:
  pull_request:
    branches: [master]
  push:
    branches: [master, preview/review]
  workflow_dispatch:

permissions: {}

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            scripts/requirements.in
            scripts/requirements.txt

      - name: Install Python checks
        run: |
          python -m pip install --require-hashes -r scripts/requirements.txt
          python -m pip check

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm

      - name: Install JavaScript checks
        run: npm ci

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3.5"
          bundler-cache: true

      - name: Install browser runtime
        run: npx playwright install --with-deps --no-shell chromium

      - name: Run complete repository validation
        run: python scripts/validate.py --browser
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Record preview source
        if: github.event_name == 'push' && github.ref == 'refs/heads/preview/review'
        run: printf '%s\n' "$GITHUB_SHA" > _site/preview-source-sha.txt

      - name: Upload browser failure artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: browser-failure-artifacts
          path: test-results
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload preview artifact
        uses: actions/upload-artifact@v7
        with:
          name: site-preview
          path: _site
          if-no-files-found: error
          retention-days: 7

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download verified site
        uses: actions/download-artifact@v8
        with:
          name: site-preview
          path: _site

      - name: Deploy
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: _site
